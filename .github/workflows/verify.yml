# Continuous verification for dsh-status-chime.
#
# What this proves and does not prove, stated plainly, because a green check that
# verifies nothing is worse than no check at all.
#
# PROVES (on a genuinely clean Windows runner: no ffmpeg, no Python, no Bailian CLI,
# no DSH Desktop):
#   - a real official DSH CLI installs this package into a throwaway profile and
#     recognises it as a profile LAYER because the package declares `dsh.bundle`
#   - the manifests stay valid JSON without a BOM
#   - the plugin module imports node builtins only, so a clean machine needs nothing
#   - all 32 packaged clips exist and are non-empty (8 scenes x 2 languages x 2 formats)
#   - with no ffplay anywhere, the PowerShell backend is still detected and used
#   - the 52-check logic suite passes
#   - no personal path or credential-shaped string is committed
#
# DOES NOT PROVE:
#   - that sound reaches a speaker: a runner has no audio device, so verification
#     stops at "the player process was launched for the right clip"
#   - behaviour on a DSH version other than the pinned one below
#   - anything about macOS or Linux, which the backend layer does not support
#
# NOTE on DSH_HOME: DSH Desktop generates a `dsh.cmd` wrapper that hard-codes
# DSH_HOME, so a desktop install cannot be pointed at a scratch home. The official
# CLI installed here has no such wrapper, which is why this job installs its own.

name: verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    name: windows-latest
    runs-on: windows-latest
    timeout-minutes: 20

    env:
      # Pinned so a failure means "this plugin changed" rather than "the runner moved".
      # Raise deliberately once a newer DSH is known good.
      DSH_TEST_VERSION: '0.1.5-rc.2'

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # `dsh plugin add` installs through pnpm, which the runner image does not
      # ship. Without this the install step fails with "'pnpm' is not recognized"
      # long before it can say anything about the plugin itself.
      #
      # Pinned to the pnpm major line that the profile layout is known to work
      # with. A profile carries a `pnpm-workspace.yaml` declaring `packages: [.]`,
      # which makes it look like a workspace root; pnpm 9 refuses a plain `add`
      # there with ERR_PNPM_ADDING_TO_ROOT, while pnpm 11 accepts it.
      # pnpm 9 is deliberately avoided, not merely "older".
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      # The fallback assertions below only mean something if no external player exists.
      - name: Confirm no ffplay on the runner
        shell: pwsh
        run: |
          $ffplay = Get-Command ffplay -ErrorAction SilentlyContinue
          if ($ffplay) {
            Write-Host "ffplay found at $($ffplay.Source); the fallback checks would be meaningless."
            exit 1
          }
          Write-Host 'no ffplay present, as expected'

      - name: Validate manifests and clips (reject a BOM)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          # Read bytes rather than text: Windows PowerShell 5.1 decodes UTF-8 files as
          # ANSI by default on CJK systems, which corrupts Chinese content and makes
          # ConvertFrom-Json fail with a misleading parse error.
          function Read-Json([string]$path) {
            $text = [Text.Encoding]::UTF8.GetString([IO.File]::ReadAllBytes($path))
            return $text | ConvertFrom-Json
          }

          foreach ($file in @('package.json', 'assets/clips.json', 'assets/voice-alerts.config.json')) {
            $bytes = [IO.File]::ReadAllBytes((Resolve-Path $file))[0..2]
            if ($bytes[0] -eq 0xEF -and $bytes[1] -eq 0xBB -and $bytes[2] -eq 0xBF) {
              throw "$file starts with a UTF-8 BOM; DSH parses it with JSON.parse and will refuse to start."
            }
          }

          $pkg = Read-Json 'package.json'
          if (-not $pkg.dsh.bundle.patch) { throw 'package.json declares no dsh.bundle.patch; it would install as a plain dependency' }
          if (-not (Test-Path $pkg.dsh.bundle.patch)) { throw "dsh.bundle.patch points at a missing file: $($pkg.dsh.bundle.patch)" }

          $clips = Read-Json 'assets/clips.json'
          $scenes = @($clips.clips.PSObject.Properties.Name)
          if ($scenes.Count -ne 8) { throw "expected 8 scenes in clips.json, found $($scenes.Count)" }

          # Every shipped language needs a complete set: the default keeps the
          # bare <scene> name, every other language uses <scene>.<code>.
          $default = if ($clips.defaultLanguage) { $clips.defaultLanguage } else { 'zh' }
          $languages = @($default) + @($clips.languages.PSObject.Properties.Name | Where-Object { $_ -ne $default })
          if ($languages.Count -lt 2) { throw "clips.json declares only one language; the bilingual sets are the point" }

          $checked = 0
          foreach ($lang in $languages) {
            foreach ($scene in $scenes) {
              $base = if ($lang -eq $default) { $scene } else { "$scene.$lang" }
              foreach ($ext in @('mp3', 'wav')) {
                $clip = "assets/clips/$base.$ext"
                if (-not (Test-Path $clip)) { throw "missing clip: $clip" }
                if ((Get-Item $clip).Length -lt 1000) { throw "clip is suspiciously small: $clip" }
                $checked++
              }
            }
          }

          # Each scene must carry copy for every non-default language, or the
          # regeneration path would silently skip it.
          foreach ($scene in $scenes) {
            foreach ($lang in $languages) {
              if ($lang -eq $default) { continue }
              $copy = $clips.clips.$scene.$lang
              if (-not $copy -or -not $copy.text) { throw "clips.json: $scene has no '$lang' copy" }
            }
          }
          Write-Host "manifests valid; $($scenes.Count) scenes x $($languages.Count) languages x 2 formats = $checked clips ($($languages -join ', '))"

      - name: Install the official DSH CLI
        shell: pwsh
        run: |
          # dsh shells out to pnpm for plugin installs; fail here with a clear
          # message rather than deep inside dsh if it ever goes missing again.
          if (-not (Get-Command pnpm -ErrorAction SilentlyContinue)) {
            throw 'pnpm is not on PATH; dsh plugin add cannot work without it'
          }
          $pnpmVersion = pnpm --version
          $pnpmMajor = [int]($pnpmVersion -split '\.')[0]
          if ($pnpmMajor -lt 10) {
            throw "pnpm $pnpmVersion cannot add into a profile: the profile's pnpm-workspace.yaml makes it look like a workspace root, and pnpm 9 rejects a plain add with ERR_PNPM_ADDING_TO_ROOT"
          }
          Write-Host "pnpm $pnpmVersion"
          npm install --global "@deepseek-ai/dsh@$env:DSH_TEST_VERSION"
          if ($LASTEXITCODE -ne 0) { throw "installing the DSH CLI failed with exit code $LASTEXITCODE" }
          dsh --version

      - name: Install this plugin into a throwaway profile and assert it became a layer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $dshHome = Join-Path $env:RUNNER_TEMP 'dsh-home'
          New-Item -ItemType Directory -Force -Path $dshHome | Out-Null
          $env:DSH_HOME = $dshHome
          Write-Host "DSH_HOME=$dshHome"

          # Create the profile by letting dsh initialise it, then inspect where it landed.
          # The official CLI honours DSH_HOME; a desktop wrapper would not, which is why
          # this asserts the location instead of assuming it.
          Set-Content -Path (Join-Path $dshHome 'placeholder') -Value 'x' -Encoding ascii
          dsh plugin --profile ci add (Get-Location).Path
          $installExit = $LASTEXITCODE

          $profileDir = Join-Path $dshHome 'profiles/ci'
          if (-not (Test-Path $profileDir)) {
            Write-Host "expected profile directory not found: $profileDir"
            Get-ChildItem $dshHome -Recurse -Depth 2 -ErrorAction SilentlyContinue | Select-Object -First 40 FullName
            throw 'DSH_HOME was not honoured: the profile was created elsewhere'
          }

          $manifestPath = Join-Path $profileDir 'package.json'
          if (-not (Test-Path $manifestPath)) { throw "no profile manifest at $manifestPath" }

          $after = Get-Content $manifestPath -Raw | ConvertFrom-Json
          $deps = @($after.dependencies.PSObject.Properties.Name)
          $bundles = @($after.dsh.profile.bundles)

          Write-Host "install exit code: $installExit"
          Write-Host "dependencies: $($deps -join ', ')"
          Write-Host "bundles:      $($bundles -join ', ')"

          if ($deps -notcontains 'dsh-status-chime') { throw 'the package was not added to dependencies' }
          # The assertion that actually matters: a layer, not merely a dependency.
          if ($bundles -notcontains 'dsh-status-chime') { throw 'the package was NOT registered in dsh.profile.bundles' }
          Write-Host 'installed and registered as a profile layer'

      - name: Confirm the plugin needs no third-party runtime dependency
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $content = Get-Content 'lib/index.js' -Raw
          $imports = [regex]::Matches($content, "(?m)^import .*?from\s+'([^']+)'") | ForEach-Object { $_.Groups[1].Value }
          Write-Host "imports: $($imports -join ', ')"
          $nonBuiltin = @($imports | Where-Object { -not $_.StartsWith('node:') })
          if ($nonBuiltin.Count -gt 0) {
            throw "lib/index.js imports non-builtin modules: $($nonBuiltin -join ', ')"
          }
          Write-Host 'node builtins only'

      - name: Run the logic suite
        shell: pwsh
        run: |
          $output = node scripts/selftest.mjs 2>&1 | Out-String
          Write-Host $output
          if ($LASTEXITCODE -ne 0) { throw "selftest failed with exit code $LASTEXITCODE" }

      - name: Verify the PowerShell backend with no ffplay installed
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # The suite already exercised this path; asserting it by name keeps the
          # "zero dependency" promise from silently disappearing.
          $output = node scripts/selftest.mjs 2>&1 | Out-String
          if ($output -notmatch 'falls back to PowerShell') { throw 'the PowerShell fallback check did not run' }
          if ($output -match '(?m)^FAIL.*falls back') { throw 'the PowerShell fallback FAILED on a machine with no ffmpeg' }
          Write-Host 'ships-with-Windows playback verified without ffmpeg'

      - name: Privacy scan
        shell: pwsh
        run: |
          node scripts/scan-sensitive.mjs .
          if ($LASTEXITCODE -ne 0) { throw "privacy scan failed with exit code $LASTEXITCODE" }
